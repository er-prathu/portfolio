<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>City intro (dev preview)</title>
<meta name="robots" content="noindex">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;font:13px system-ui;color:#eee}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:10px;top:10px;background:rgba(0,0,0,.5);padding:6px 10px;border-radius:6px}</style>
</head><body>
<canvas id="c"></canvas><div id="hud"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="city.js"></script>
<script>
/* Dev preview of the city intro on its own: city.html?tier=high|mid|low&t=seconds (t holds one moment) */
const q = new URLSearchParams(location.search);
const intro = CityIntro.create({ canvas: document.getElementById('c'), tier: q.get('tier') || 'high', hold: q.get('t'),
  onCaption: i => console.log('caption', i) });
document.getElementById('hud').textContent = `tier ${intro.tier} · post ${intro.post} · shadows ${intro.shadows} · ${intro.buildings} buildings · ${intro.duration}s`;
let n = 0, t = performance.now(); (function fps(){ n++; const d = performance.now() - t; if (d > 1000) { document.getElementById('hud').dataset.fps = Math.round(n * 1000 / d); n = 0; t = performance.now(); } requestAnimationFrame(fps); })();
intro.play().then(r => { document.getElementById('hud').textContent += ' · ended: ' + r; });
addEventListener('keydown', e => { if (e.key === 'Escape') intro.skip(); });
</script>
</body></html>
